# Republish the MCP server to the official registry when its version changes.
# The steps, and why the domain key rather than OIDC, live in the reusable
# workflow in wiki-formant; this file keeps only the trigger.
#
# This repository is public, so the trigger is deliberately push-to-main only.
# Never add a pull_request or pull_request_target trigger: that is the path by
# which a fork could run workflow code with the publishing credential in scope.

name: Publish to MCP Registry

on:
  push:
    branches: [main]
    paths: ['server.json']
  workflow_dispatch:

concurrency:
  group: mcp-registry-publish
  cancel-in-progress: false

jobs:
  publish:
    uses: tutmoses/wiki-formant/.github/workflows/publish-mcp-registry.yml@main
    with: { domain: radix.wiki }
    secrets:
      MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
