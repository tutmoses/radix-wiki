# Republish the MCP server to the official registry when its version changes.
#
# The registry entry is pinned to whatever version was last published, so a
# version bump in server.json is otherwise invisible to clients. This closes
# that gap without making every deploy a publish.
#
# Auth note: the server lives in the DOMAIN namespace `wiki.radix/*`, which
# GitHub OIDC cannot grant — OIDC only covers `io.github.<owner>/*`. So this
# needs the Ed25519 key, and `login http` verifies it against
# https://radix.wiki/.well-known/mcp-registry-auth, which serves the public
# half from the MCP_REGISTRY_PUBLIC_KEY env var on Vercel. Rotating the key
# means updating BOTH the Vercel var and the MCP_REGISTRY_PRIVATE_KEY secret,
# or this job fails with a signature error.
#
# This repository is public, so the trigger is deliberately push-to-main only.
# Never add a pull_request trigger: that is the path by which a fork could run
# workflow code with the publishing credential in scope.

name: Publish to MCP Registry

on:
  push:
    branches: [main]
    paths: ['server.json']
  workflow_dispatch:

concurrency:
  group: mcp-registry-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Check whether the version actually changed
        id: check
        run: |
          LOCAL="$(jq -r .version server.json)"
          NAME="$(jq -r .name server.json)"
          PUBLISHED="$(curl -sf --max-time 20 \
            "https://registry.modelcontextprotocol.io/v0/servers?search=${NAME##*/}" \
            | jq -r --arg n "$NAME" \
              '[.servers[].server | select(.name == $n)] | max_by(.version) | .version // "none"')"
          echo "local=$LOCAL published=$PUBLISHED"
          if [ "$LOCAL" = "$PUBLISHED" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::server.json changed but version $LOCAL is already published — skipping."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pinned rather than `latest`: this step executes a downloaded binary in a
      # job that holds a publishing credential, so the version should change
      # only when someone chooses to change it.
      - name: Install mcp-publisher
        if: steps.check.outputs.changed == 'true'
        env:
          PUBLISHER_VERSION: v1.8.0
        run: |
          curl -fsSL -o publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL -o checksums.txt \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/registry_${PUBLISHER_VERSION#v}_checksums.txt"
          grep " mcp-publisher_linux_amd64.tar.gz\$" checksums.txt | sed 's/ .*/  publisher.tar.gz/' | sha256sum -c -
          tar xzf publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher

      - name: Authenticate and publish
        if: steps.check.outputs.changed == 'true'
        env:
          PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: |
          if [ -z "$PRIVATE_KEY" ]; then
            echo "::error::MCP_REGISTRY_PRIVATE_KEY is not set — cannot publish."
            exit 1
          fi
          ./mcp-publisher login http --domain=radix.wiki --private-key="$PRIVATE_KEY"
          ./mcp-publisher publish
